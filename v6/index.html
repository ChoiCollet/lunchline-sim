<header class="topbar">

<footer class="foot-note">
  <p>Polycam LiDAR 실측 스캔(2026-08-21, 2층 전체 층 + 세면대·음수대 구역)을 기반으로 계단실 연결 복도(약 18m)→
  메인 복도(약 30.5m, 교실 다수 통과)→방풍실 전실(약 9m)로 이어지는 실제 꺾임 구조와 반별 좌우 배정(짝수반 左·홀수반 右),
  입구·출구 분리 구조를 반영했습니다. 문 안쪽 세면대→배식대 구간을 포함한 그 외 세부 치수는 실제와 100% 일치하지 않을 수 있습니다.</p>
</footer>
